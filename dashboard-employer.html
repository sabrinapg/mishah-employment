<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employer Dashboard — Mishah Employment Agency</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <nav class="nav">
    <a href="index.html" class="brand">
      <img src="assets/logo_tight.png" alt="Mishah Employment Agency logo">
      <span class="brand-text">Mishah<span>Employment Agency</span></span>
    </a>
    <button class="nav-toggle" aria-label="Toggle menu"><span></span><span></span><span></span></button>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="process.html">Process</a></li>
      <li><a href="jobs.html">Jobs</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li class="nav-account" id="nav-account-slot"></li>
    </ul>
  </nav>
</header>

<div class="dash-header">
  <div class="wrap">
    <div class="eyebrow on-dark">Employer Dashboard</div>
    <h1 id="dash-title">Welcome back</h1>
    <p>Post roles, review applicants, and manage your open listings.</p>
  </div>
</div>

<div class="dash-body">
  <div class="wrap">
    <div class="dash-stats" id="dash-stats"></div>

    <div class="dash-section">
      <div class="dash-section-head">
        <h2>Post a new role</h2>
      </div>
      <div class="form-card" style="max-width:640px;">
        <div class="auth-error" id="post-error"></div>
        <form id="post-job-form">
          <div class="field-row">
            <div class="field">
              <label for="title">Job title</label>
              <input type="text" id="title" required>
            </div>
            <div class="field">
              <label for="category">Category</label>
              <select id="category" required>
                <option value="">Select...</option>
                <option>Live-in Domestic Helper</option>
                <option>Childcare / Nanny</option>
                <option>Elderly Care</option>
                <option>Cooking & Household Management</option>
              </select>
            </div>
          </div>
          <div class="field-row">
            <div class="field">
              <label for="location">Location</label>
              <input type="text" id="location" placeholder="e.g. Gadong, Bandar Seri Begawan" required>
            </div>
            <div class="field">
              <label for="type">Job type</label>
              <select id="type">
                <option>Full-time</option>
                <option>Part-time</option>
                <option>Contract</option>
              </select>
            </div>
          </div>
          <div class="field">
            <label for="salaryRange">Salary range (optional)</label>
            <input type="text" id="salaryRange" placeholder="e.g. BND 500 - 700">
          </div>
          <div class="field">
            <label for="description">Description</label>
            <textarea id="description" required placeholder="What does this role involve day to day?"></textarea>
          </div>
          <div class="field">
            <label for="requirements">Requirements (optional)</label>
            <textarea id="requirements" placeholder="Experience, documentation, availability, etc."></textarea>
          </div>
          <button type="submit" class="btn btn-navy" id="post-submit">Post job</button>
        </form>
      </div>
    </div>

    <div class="dash-section">
      <div class="dash-section-head">
        <h2>Your listings</h2>
      </div>
      <div id="jobs-error" class="auth-error"></div>
      <div id="jobs-list" class="card-list"></div>
    </div>
  </div>
</div>

<script src="auth-client.js"></script>
<script src="script.js"></script>
<script>
const user = requireRole('employer');

async function loadDashboard() {
  if (!user) return;
  document.getElementById('dash-title').textContent = `Welcome back, ${user.name.split(' ')[0]}`;
  await loadJobs();
}

async function loadJobs() {
  const list = document.getElementById('jobs-list');
  const errorBox = document.getElementById('jobs-error');
  errorBox.classList.remove('show');
  list.innerHTML = '<p style="color:var(--ink-soft)">Loading your listings...</p>';

  try {
    const data = await apiFetch('/jobs/mine');
    renderStats(data.jobs);
    renderJobs(data.jobs);
  } catch (err) {
    list.innerHTML = '';
    errorBox.textContent = err.message;
    errorBox.classList.add('show');
  }
}

function renderStats(jobs) {
  const open = jobs.filter(j => j.status === 'open').length;
  const totalApplicants = jobs.reduce((sum, j) => sum + j.applicantCount, 0);
  document.getElementById('dash-stats').innerHTML = `
    <div class="stat-card"><div class="n">${jobs.length}</div><div class="l">Total listings</div></div>
    <div class="stat-card"><div class="n">${open}</div><div class="l">Currently open</div></div>
    <div class="stat-card"><div class="n">${totalApplicants}</div><div class="l">Total applicants</div></div>
    <div class="stat-card"><div class="n">${jobs.length - open}</div><div class="l">Closed listings</div></div>
  `;
}

function renderJobs(jobs) {
  const list = document.getElementById('jobs-list');
  if (!jobs.length) {
    list.innerHTML = '<div class="empty-state">You haven\'t posted any roles yet — use the form above to post your first one.</div>';
    return;
  }
  list.innerHTML = jobs.map(job => `
    <div class="list-card">
      <div class="list-card-top">
        <div>
          <h4>${escapeHtml(job.title)}</h4>
          <div class="meta">${escapeHtml(job.category)} · ${escapeHtml(job.location)} · ${job.applicantCount} applicant${job.applicantCount === 1 ? '' : 's'}</div>
        </div>
        <span class="badge badge-${job.status}">${job.status}</span>
      </div>
      <div class="list-card-actions">
        <button class="btn btn-outline" onclick="toggleApplicants('${job.id}')">View applicants</button>
        <button class="link-btn" onclick="toggleJobStatus('${job.id}', '${job.status}')">${job.status === 'open' ? 'Close listing' : 'Reopen listing'}</button>
      </div>
      <div id="applicants-${job.id}" style="display:none; margin-top:14px;"></div>
    </div>
  `).join('');
}

async function toggleJobStatus(jobId, currentStatus) {
  const next = currentStatus === 'open' ? 'closed' : 'open';
  try {
    await apiFetch(`/jobs/${jobId}`, { method: 'PATCH', body: JSON.stringify({ status: next }) });
    loadJobs();
  } catch (err) {
    alert(err.message);
  }
}

async function toggleApplicants(jobId) {
  const box = document.getElementById(`applicants-${jobId}`);
  if (box.style.display === 'block') { box.style.display = 'none'; return; }
  box.style.display = 'block';
  box.innerHTML = '<p style="color:var(--ink-soft); font-size:14px;">Loading applicants...</p>';

  try {
    const data = await apiFetch(`/jobs/${jobId}/applications`);
    if (!data.applications.length) {
      box.innerHTML = '<div class="empty-state">No applicants yet.</div>';
      return;
    }
    box.innerHTML = data.applications.map(a => `
      <div class="applicant-row">
        <div class="who">
          <strong>${escapeHtml(a.seeker ? a.seeker.name : 'Unknown applicant')}</strong>
          ${a.seeker ? escapeHtml(a.seeker.email) + (a.seeker.phone ? ' · ' + escapeHtml(a.seeker.phone) : '') : ''}
          ${a.coverNote ? `<div class="note">${escapeHtml(a.coverNote)}</div>` : ''}
        </div>
        <select class="status-select" onchange="updateApplicationStatus('${a.id}', this.value, '${jobId}')">
          ${['submitted','reviewing','shortlisted','rejected','hired'].map(s => `<option value="${s}" ${a.status === s ? 'selected' : ''}>${s}</option>`).join('')}
        </select>
      </div>
    `).join('');
  } catch (err) {
    box.innerHTML = `<div class="auth-error show">${escapeHtml(err.message)}</div>`;
  }
}

async function updateApplicationStatus(appId, status, jobId) {
  try {
    await apiFetch(`/applications/${appId}`, { method: 'PATCH', body: JSON.stringify({ status }) });
  } catch (err) {
    alert(err.message);
  }
}

document.getElementById('post-job-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorBox = document.getElementById('post-error');
  const submitBtn = document.getElementById('post-submit');
  errorBox.classList.remove('show');

  const payload = {
    title: document.getElementById('title').value.trim(),
    category: document.getElementById('category').value,
    location: document.getElementById('location').value.trim(),
    type: document.getElementById('type').value,
    salaryRange: document.getElementById('salaryRange').value.trim(),
    description: document.getElementById('description').value.trim(),
    requirements: document.getElementById('requirements').value.trim()
  };

  submitBtn.disabled = true;
  submitBtn.textContent = 'Posting...';
  try {
    await apiFetch('/jobs', { method: 'POST', body: JSON.stringify(payload) });
    document.getElementById('post-job-form').reset();
    loadJobs();
  } catch (err) {
    errorBox.textContent = err.message;
    errorBox.classList.add('show');
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Post job';
  }
});

loadDashboard();
</script>
</body>
</html>
